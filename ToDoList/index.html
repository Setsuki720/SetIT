<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планировщик задач</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <button class="clear-storage-btn" id="clearBtn">Очистить локальное хранилище</button>
    
    <h1>Мои дела</h1>

    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Введите название нового дела">
        <button class="add-btn" id="addBtn">Добавить дело</button>
    </div>

    <ul class="task-list" id="taskList">
    </ul>
</div>

<script src="script.js"></script>
</body>
</html>
